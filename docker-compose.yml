# Heater C advisory: dashboard + ops jobs. SYNTHETIC unless ./site holds a signed site config.
# Site folder layout (SITE_DIR, default ./site): config/site.yaml (+ tag map), data/, models/, reports/, incoming/ (read-only historian CSV exports).
# Network: the app container is on an INTERNAL network (no outbound route). The gateway only forwards 127.0.0.1:8501 -> app:8501.
# Ops jobs (monitor, retrain) use network_mode none. Start: docker compose up -d    Jobs: docker compose --profile ops run --rm monitor
x-common: &common
  image: heater-c-advisory:0.9
  build: .
  user: "10001:10001"
  read_only: true
  tmpfs: ["/tmp"]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  environment:
    MODE: ${MODE:-SHADOW}
    HEATER_SITE: /app/config/site.yaml
  volumes: &site
    - ${SITE_DIR:-./site}/config:/app/config:ro
    - ${SITE_DIR:-./site}/data:/app/data
    - ${SITE_DIR:-./site}/models:/app/models
    - ${SITE_DIR:-./site}/reports:/app/reports
    - ${SITE_DIR:-./site}/incoming:/incoming:ro

services:
  app:
    <<: *common
    networks: [backend]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health',timeout=3).read()==b'ok' else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
  gateway:
    <<: *common
    command: ["python", "-m", "src.ops.tcp_proxy", "--listen", "0.0.0.0:8501", "--target", "app:8501"]
    ports: ["127.0.0.1:8501:8501"]
    depends_on: [app]
    networks: [backend, frontend]
    volumes: []
  shadow:
    <<: *common
    profiles: [ops]
    command: ["sh", "/app/ops/shadow_loop.sh"]
    network_mode: none
  monitor:
    <<: *common
    profiles: [ops]
    command: ["python", "-m", "src.monitor", "--quiet"]
    network_mode: none
  retrain:
    <<: *common
    profiles: [ops]
    command: ["python", "-m", "src.retrain", "--dry-run", "--site", "/app/config/site.yaml"]
    network_mode: none

networks:
  backend:
    internal: true
  frontend: {}
